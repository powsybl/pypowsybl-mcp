name: pytest

on:
  push:
    branches-ignore:
      - main
jobs:
  tests:
    # The two OSes differ in ways this suite can catch: clock resolution,
    # temporary-file locking and path separators. Code touching any of them
    # can only be trusted once it has run on both.
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel one OS because the other failed: the difference between
      # them is the whole point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
      - name: Run pytests
        # bash on both legs: the Windows default shell is pwsh, which does not
        # abort on a failing native command, so a red pytest could be masked by
        # the coverage report that follows it and the job would pass.
        shell: bash
        run: |
          coverage run -m pytest
          coverage report
