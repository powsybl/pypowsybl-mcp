name: pytest

on:
  push:
    branches-ignore:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
      - name: Run pytests
        run: |
          coverage run -m pytest
          coverage report
